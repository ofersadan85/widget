[package]
name = "widget"
version = "0.1.0"
edition = "2024"
authors = ["Ofer Sadan <ofersadan85@gmail.com>"]

[dependencies]
ffmpeg-next = "9.0.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"
winsafe = { version = "0.0.28", features = ["gdi", "user"] }
clap = { version = "4.6.6", features = ["derive"] }

# [lints.rust]
# unused_imports = "allow"
# dead_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# DENY PANICS
# unwrap_used = "deny"
# expect_used = "deny"
# indexing_slicing = "deny"
# arithmetic_side_effects = "deny"
# unreachable = "deny"
# unimplemented = "deny"
# unchecked_time_subtraction = "deny"
# todo = "deny"
# string_slice = "deny"
# panic_in_result_fn = "deny"
# panic = "deny"
# exit = "deny"
# as_conversions = "deny"
